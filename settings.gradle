pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven{url "https://repo.opencollab.dev/maven-snapshots"}
        maven{url "https://repo.opencollab.dev/maven-releases"}
    }
}

rootProject.name = 'PocketLauncher'
include ':app'
include ':minecraft'
include ':pojav_controls'

// End-to-end launch test fixture (e2e/README.md). Opt-in so regular and CI builds skip it.
if (providers.gradleProperty('levi.e2e').getOrElse('false') == 'true') {
    include ':e2e:placeholder-game'
}
